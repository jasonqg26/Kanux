name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Verify tag and manifest version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          test "$tag" = "$version"

      - name: Build and test plugin
        run: |
          node build.js
          node tests/helpers.test.js
          node tests/modals.test.js
          node tests/plugin.test.js
          node tests/board-view.test.js
          node --check main.js

      # The bundle is generated, so a syntax error can only come from a source
      # file; checking main.js alone would let one through that build.js happens
      # to concatenate into something still parseable.
      - name: Syntax-check every source file
        run: node -e "const{readdirSync}=require('fs'),{execFileSync}=require('child_process');readdirSync('src',{recursive:true}).filter(f=>f.endsWith('.js')).forEach(f=>execFileSync(process.execPath,['--check','src/'+f]))"

      - name: Check the version is releasable
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          node -p "require('./versions.json')['$version'] || (console.error('versions.json has no entry for $version'), process.exit(1))"

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="Kanux $tag" \
            --generate-notes \
            --draft \
            main.js manifest.json styles.css
